

<div class="container">
    <div class="row">
        <div class="col-md-6 offset-3 mt-5">
            <app-post-form
            (emitNewObj)="onSubmit($event)"
            (emitUpdtObj)="onUpdt($event)"></app-post-form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mt-3" *ngFor="let post of postArr">
            <app-post-card
            [getData]="post"
            (delData)="onRemove($event)"></app-post-card>
        </div>
    </div>

</div>
